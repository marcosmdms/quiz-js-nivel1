po de dado representa verdadeiro ou falso?",options:["string","number","boolean","logic"],correct:2,explain:"boolean tem apenas dois valores possíveis: true ou false."},{id:4,text:"O que typeof \"texto\" retorna?",options:["\"text\"","\"string\"","string","text"],correct:2,explain:"typeof retorna o nome do tipo como string. Para textos, retorna 'string'."},{id:5,text:"Qual é o resultado de typeof 42 ?",options:["number","int","digit","42"],correct:0,explain:"Números, inteiros ou decimais, têm tipo number em JavaScript."},{id:6,text:"PEGADINHA: O que typeof null retorna?",options:["null","object","undefined","number"],correct:1,explain:"Bug histórico do JS! typeof null retorna 'object'. É considerado um erro da linguagem que nunca foi corrigido."},{id:7,text:"O que acontece com let x; console.log(x); ?",options:["ReferenceError","undefined","null","0"],correct:1,explain:"Variável declarada sem valor recebe undefined automaticamente. Só daria ReferenceError se nunca tivesse sido declarada."}]},{id:2,title:"Operadores Básicos",subtitle:"Comparação e lógica - Nível Capcioso",icon:"≋",questions:[{id:8,text:"Qual operador verifica igualdade estrita (valor e tipo)?",options:["==","=","===","!="],correct:2,explain:"=== verifica valor e tipo, sem conversão automática."},{id:9,text:"Qual é o resultado de 10 > 5 && 5 > 2 ?",options:["false","true","0","2"],correct:1,explain:"Ambas comparações são verdadeiras, e && retorna true se ambos forem true."},{id:10,text:"Qual operador inverte um valor booleano?",options:["~","!","not","invert"],correct:1,explain:"! é o operador NOT lógico. !true vira false."},{id:11,text:"Qual é o resultado de 10 + \"5\" ?",options:["15","\"105\"","\"10 5\"","erro"],correct:1,explain:"Quando um dos lados é string, + concatena. Vira \"105\"."},{id:12,text:"Qual operador verifica diferença estrita?",options:["<>","!==","!=","!==="],correct:1,explain:"!== verifica se valor ou tipo são diferentes, sem conversão."},{id:13,text:"CAPCIOSA: Qual o resultado de 0 == false ?",options:["false","true","erro","undefined"],correct:1,explain:"Com == há coerção. 0 é convertido e 0 == false dá true. Com === daria false."},{id:14,text:"CAPCIOSA: Qual o resultado de NaN === NaN ?",options:["true","false","NaN","erro"],correct:1,explain:"NaN nunca é igual a ele mesmo! NaN === NaN é false. Use Number.isNaN() para checar."},{id:15,text:"CAPCIOSA: Qual o resultado de \"5\" - 3 ?",options:["\"53\"","2","\"2\"","53"],correct:1,explain:"Pegadinha! O operador - não concatena, ele converte para número. \"5\" - 3 = 2. Diferente do +."}]},{id:3,title:"Condicionais",subtitle:"Fluxo de decisão - Nível Capcioso",icon:"◑",questions:[{id:16,text:"Qual estrutura executa um bloco apenas se a condição for verdadeira?",options:["loop","if","else","case"],correct:1,explain:"if avalia a condição e executa o bloco quando ela é verdadeira."},{id:17,text:"Qual palavra-chave representa o caminho alternativo de um if?",options:["otherwise","else","elif","or"],correct:1,explain:"else define o bloco executado quando a condição do if é falsa."},{id:18,text:"Em if (0) { ... }, o bloco interno é executado?",options:["Sim, sempre","Não, 0 é falsy","Apenas em modo estrito","Depende do navegador"],correct:1,explain:"0 é um valor falsy, então a condição é considerada falsa."},{id:19,text:"Como verificar se duas condições são verdadeiras ao mesmo tempo?",options:["usando or","usando &&","usando +","usando and"],correct:1,explain:"&& exige que ambos os lados sejam verdadeiros."},{id:20,text:"A estrutura switch é mais útil para...",options:["repetir código","comparar um valor com várias opções","criar variável","somar valores"],correct:1,explain:"switch compara um valor com vários casos de forma organizada."},{id:21,text:"CAPCIOSA: O que acontece em um switch sem break?",options:["Para no case","Continua executando os próximos cases (fallthrough)","Dá erro","Retorna undefined"],correct:1,explain:"Sem break, o JS faz fallthrough e executa todos os cases abaixo, mesmo que não correspondam. Erro clássico!"},{id:22,text:"CAPCIOSA: Qual o bug em if (x = 5) { ... } ?",options:["Compara x com 5","Atribui 5 a x e o if sempre será verdadeiro","Dá erro de sintaxe","Compara de forma estrita"],correct:1,explain:"= é atribuição, não comparação. if (x = 5) atribui 5 a x, e 5 é truthy, então sempre entra no if."},{id:23,text:"CAPCIOSA: Em if (a>10) if (a>5) console.log('A') else console.log('B'), o else pertence a qual if?",options:["Ao primeiro if (a>10)","Ao segundo if mais interno (a>5)","Aos dois","A nenhum"],correct:1,explain:"O else sempre se associa ao if mais próximo e mais interno. Se a=8, imprime B. Pegadinha de escopo!"}]},{id:4,title:"Lógica e Booleanos",subtitle:"Valores verdadeiros - Nível Capcioso",icon:"◍",questions:[{id:24,text:"Qual é o resultado de !!0 ?",options:["true","false","0","1"],correct:1,explain:"!! converte para booleano. 0 é falsy, então !!0 é false."},{id:25,text:"Qual destes valores é considerado falsy?",options:["\"0\"","\"false\"","\"\" (texto vazio)","\" \" (espaço)"],correct:2,explain:"Texto vazio é falsy. Os outros textos não vazios são truthy."},{id:26,text:"Qual é o resultado de true || false ?",options:["false","true","0","erro"],correct:1,explain:"|| retorna true se pelo menos um lado for verdadeiro."},{id:27,text:"Como verificar se um valor é null ou undefined com comparação frouxa?",options:["valor === null","valor == null","valor = null","valor != null"],correct:1,explain:"valor == null é verdadeiro para null e undefined ao mesmo tempo."},{id:28,text:"O operador ternário cond ? a : b faz o quê?",options:["soma a e b","escolhe entre dois valores baseado na condição","compara cond com a","cria uma condição"],correct:1,explain:"Se cond for verdadeira, resulta em a, senão em b."},{id:29,text:"CAPCIOSA: Qual o resultado de 0 || \"padrão\" ?",options:["0","\"padrão\"","false","true"],correct:1,explain:"|| retorna o primeiro truthy. Como 0 é falsy, retorna \"padrão\". Usado para valor padrão, mas tem pegadinha com 0."},{id:30,text:"CAPCIOSA: Qual a diferença entre || e ?? (nullish coalescing)?",options:["São iguais","|| trata 0 e \"\" como falsy, ?? só considera null/undefined","?? trata 0 como falsy, || não","|| só funciona com boolean"],correct:1,explain:"Pegadinha master! 0 || 100 = 100, mas 0 ?? 100 = 0. ?? é mais seguro para manter 0 ou string vazia como valor válido."}]}];;function Pi(){let[e,n]=me.useState("light"),[t,r]=me.useState(0),[l,u]=me.useState(0),[o,i]=me.useState(null),[a,f]=me.useState(!1),[p,v]=me.useState([0,0,0,0]),[m,S]=me.useState(Array(4).fill(null).map(()=>Array(8).fill(!1))),[k,w]=me.useState(Array(4).fill(null).map(()=>Array(8).fill(!1))),[O,c]=me.useState(Array(4).fill(!1)),[s,d]=me.useState(!1);me.useEffect(()=>{let T=localStorage.getItem("js-quiz-theme");if(T)n(T);else if(window.matchMedia("(prefers-color-scheme: dark)").matches)n("dark");let D=localStorage.getItem("js-quiz-progress-v3");if(D)try{let R=JSON.parse(D);if(R.phaseScores)v(R.phaseScores);if(R.answeredMap)S(R.answeredMap);if(R.correctMap)w(R.correctMap);if(R.completed)c(R.completed);if(typeof R.currentPhase==="number")r(R.currentPhase);if(typeof R.currentQ==="number")u(R.currentQ)}catch{}},[]),me.useEffect(()=>{localStorage.setItem("js-quiz-theme",e)},[e]),me.useEffect(()=>{let T={phaseScores:p,answeredMap:m,correctMap:k,completed:O,currentPhase:t,currentQ:l};try{localStorage.setItem("js-quiz-progress-v3",JSON.stringify(T))}catch{}},[p,m,k,O,t,l]);let y=p.reduce((T,D)=>T+D,0),_=m.flat().filter(Boolean).length,N=k.flat().filter(Boolean).length,z=_/30*100,P=zi[t],F=P?.questions[l],L=l===P?.questions.length-1,ae=o!==null&&o===F?.correct,jl=(T)=>{try{document.documentElement.dataset.lastAnswer=String(T)}catch{}if(a)return;i(T),f(!0);let D=m[t][l],R=k[t][l],B=m.map((b,Ct)=>Ct===t?b.map((nu,tu)=>tu===l?!0:nu):b);S(B);let se=k.map((b,Ct)=>Ct===t?b.map((nu,tu)=>tu===l?T===F.correct:nu):b);if(w(se),!D){if(T===F.correct){let b=[...p];b[t]+=10,v(b)}}else{if(!R&&T===F.correct){let b=[...p]
