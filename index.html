e", "Não, 0 é falsy", "Apenas em modo estrito", "Depende do navegador"], "correct": 1, "explain": "0 é um valor falsy, então a condição é considerada falsa."}, {"id": 19, "text": "Como verificar se duas condições são verdadeiras ao mesmo tempo?", "options": ["usando or", "usando &&", "usando +", "usando and"], "correct": 1, "explain": "&& exige que ambos os lados sejam verdadeiros."}, {"id": 20, "text": "A estrutura switch é mais útil para...", "options": ["repetir código", "comparar um valor com várias opções", "criar variável", "somar valores"], "correct": 1, "explain": "switch compara um valor com vários casos de forma organizada."}, {"id": 21, "text": "O que acontece em um switch sem break?", "options": ["Para no case", "Continua executando os próximos cases (fallthrough)", "Dá erro", "Retorna undefined"], "correct": 1, "explain": "Sem break, o JS faz fallthrough e executa todos os cases abaixo. Erro clássico!"}, {"id": 22, "text": "Qual o bug em if (x = 5) { ... } ?", "options": ["Compara x com 5", "Atribui 5 a x e o if sempre será verdadeiro", "Dá erro de sintaxe", "Compara de forma estrita"], "correct": 1, "explain": "= é atribuição, não comparação. if (x = 5) sempre entra no if."}, {"id": 23, "text": "Em if (a>10) if (a>5) console.log('A') else console.log('B'), o else pertence a qual if?", "options": ["Ao primeiro if (a>10)", "Ao segundo if mais interno (a>5)", "Aos dois", "A nenhum"], "correct": 1, "explain": "O else sempre se associa ao if mais próximo e mais interno."}]}, {"id": 4, "title": "Lógica e Booleanos", "subtitle": "Valores verdadeiros - Nível Desafio", "icon": "◍", "questions": [{"id": 24, "text": "Qual é o resultado de !!0 ?", "options": ["true", "false", "0", "1"], "correct": 1, "explain": "!! converte para booleano. 0 é falsy, então !!0 é false."}, {"id": 25, "text": "Qual destes valores é considerado falsy?", "options": ["\"0\"", "\"false\"", "\"\" (texto vazio)", "\" \" (espaço)"], "correct": 2, "explain": "Texto vazio é falsy. Os outros textos não vazios são truthy."}, {"id": 26, "text": "Qual é o resultado de true || false ?", "options": ["false", "true", "0", "erro"], "correct": 1, "explain": "|| retorna true se pelo menos um lado for verdadeiro."}, {"id": 27, "text": "Como verificar se um valor é null ou undefined com comparação frouxa?", "options": ["valor === null", "valor == null", "valor = null", "valor != null"], "correct": 1, "explain": "valor == null é verdadeiro para null e undefined ao mesmo tempo."}, {"id": 28, "text": "O operador ternário cond ? a : b faz o quê?", "options": ["soma a e b", "escolhe entre dois valores baseado na condição", "compara cond com a", "cria uma condição"], "correct": 1, "explain": "Se cond for verdadeira, resulta em a, senão em b."}, {"id": 29, "text": "Qual o resultado de 0 || \"padrão\" ?", "options": ["0", "\"padrão\"", "false", "true"], "correct": 1, "explain": "|| retorna o primeiro truthy. Como 0 é falsy, retorna \"padrão\"."}, {"id": 30, "text": "Qual a diferença entre || e ??", "options": ["São iguais", "|| trata 0 e \"\" como falsy, ?? só considera null/undefined", "?? trata 0 como falsy, || não", "|| só funciona com boolean"], "correct": 1, "explain": "0 || 100 = 100, mas 0 ?? 100 = 0. ?? é mais seguro."}]}]

      try{
        const d = JSON.parse(saved)
        if(d.phaseScores) setPhaseScores(d.phaseScores)
        if(d.answeredMap) setAnsweredMap(d.answeredMap)
        if(d.correctMap) setCorrectMap(d.correctMap)
        if(d.completed) setCompleted(d.completed)
        if(typeof d.currentPhase==='number') setCurrentPhase(d.currentPhase)
        if(typeof d.currentQ==='number') setCurrentQ(d.currentQ)
        if(typeof d.isFinished==='boolean') setIsFinished(d.isFinished)
      }catch{}
    }
  },[])

  React.useEffect(()=>{
    localStorage.setItem(THEME_KEY, theme)
    document.documentElement.dataset.theme=theme
  },[theme])

  React.useEffect(()=>{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({phaseScores, answeredMap, correctMap, completed, currentPhase, currentQ, isFinished}))
  },[phaseScores, answeredMap, correctMap, completed, currentPhase, currentQ, isFinished])

  const phase = quizData[currentPhase]
  const question = phase?.questions[currentQ]
  const totalAnswered = answeredMap.flat().filter(Boolean).length
  const totalCorrect = correctMap.flat().filter(Boolean).length
  const totalQuestions = quizData.reduce((a,b)=>a+b.questions.length,0)
  const progress = totalQuestions? (totalAnswered/totalQuestions*100):0
  const totalScore = phaseScores.reduce((a,b)=>a+b,0)
  const isLastQInPhase = currentQ === phase.questions.length -1
  const isLastOverall = currentPhase===quizData.length-1 && isLastQInPhase

  function answer(idx){
    if(revealed) return
    setSelected(idx)
    setRevealed(true)
    const isCorrect = idx===question.correct
    const already = answeredMap[currentPhase][currentQ]
    const wasCorrect = correctMap[currentPhase][currentQ]

    const newAns = answeredMap.map((arr,p)=> p===currentPhase ? arr.map((v,q)=> q===currentQ?true:v):arr)
    setAnsweredMap(newAns)
    const newCor = correctMap.map((arr,p)=> p===currentPhase ? arr.map((v,q)=> q===currentQ?isCorrect:v):arr)
    setCorrectMap(newCor)

    if(!already && isCorrect){
      const ns=[...phaseScores]; ns[currentPhase]+=10; setPhaseScores(ns)
    } else if(already){
      if(!wasCorrect && isCorrect){const ns=[...phaseScores]; ns[currentPhase]+=10; setPhaseScores(ns)}
      if(wasCorrect && !isCorrect){const ns=[...phaseScores]; ns[currentPhase]=Math.max(0,ns[currentPhase]-10); setPhaseScores(ns)}
    }

    if(newAns[currentPhase].every(Boolean)){
      const nc=[...completed]; nc[currentPhase]=true; setCompleted(nc)
    }
  }

  function next(){
    if(isLastOverall){ setIsFinished(true); return }
    if(currentQ < phase.questions.length-1){ setCurrentQ(q=>q+1) }
    else if(currentPhase < quizData.length-1){ setCurrentPhase(p=>p+1); setCurrentQ(0) }
    setSelected(null); setRevealed(false)
  }
  function prev(){
    if(isFinished){ setIsFinished(false); return }
    if(currentQ>0){ setCurrentQ(q=>q-1) }
    else if(currentPhase>0){ setCurrentPhase(p=>p-1); setCurrentQ(quizData[currentPhase-1].questions.length-1) }
    setSelected(null); setRevealed(false)
  }
  function goToPhase(idx){ setCurrentPhase(idx); setCurrentQ(0); setSelected(null); setRevealed(false); setIsFinished(false) }

          e('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginTop:24}},
            e('div',{className:'card', style:{padding:16}}, e('div',{className:'mono', style:{fontSize:11,color:'var(--muted)'}},'PONTUAÇÃO'), e('div',{style:{fontSize:22,fontWeight:700,marginTop:4}}, totalScore+' pts')),
            e('div',{className:'card', style:{padding:16}}, e('div',{className:'mono', style:{fontSize:11,color:'var(--muted)'}},'ACERTOS'), e('div',{style:{fontSize:22,fontWeight:700,marginTop:4}}, `${totalCorrect}/${totalQuestions}`)),
            e('div',{className:'card', style:{padding:16}}, e('div',{className:'mono', style:{fontSize:11,color:'var(--muted)'}},'APROVEITAMENTO'), e('div',{style:{fontSize:22,fontWeight:700,marginTop:4}}, percent+'%'))
          ),
          e('div',{style:{marginTop:20}}, e('div',{style:{fontSize:18,fontWeight:600}}, msg), e('p',{style:{fontSize:14,color:'var(--muted)',marginTop:8}}, `Você completou as ${quizData.length} categorias com ${totalQuestions} perguntas.`)),

      )

  }

    e('header',null, e('div',{className:'container', style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
