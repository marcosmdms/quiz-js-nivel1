         --border: #eaeaea;
         --text: #111111;
         --text-muted: #6b7280;
         --accent: #111111;
         --accent-2: #000000;
         --success: #0a7d2e;
         --success-bg: #e8f5e9;
         --danger: #c0352b;
         --danger-bg: #fdecea;
       }
       [data-theme="dark"] {
         --bg: #0a0a0a;
         --card: #111111;
         --border: #262626;
         --text: #ededed;
         --text-muted: #9ca3af;
         --accent: #ffffff;
         --accent-2: #ffffff;

         --success-bg: #14261a;

       }
        * { border-color: var(--border); box-sizing: border-box; }
        html, body { overflow-x: hidden; width: 100%; max-width: 100%; }
        body { background: var(--bg); }
        #root { max-width: 100%; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        /* corrige pills scroll sem vazar */
        .pills-scroll { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .pills-scroll::-webkit-scrollbar { display: none; }
        /* CORAÇÕES VERMELHOS FIXOS - V9 */
        .lives-row { display: inline-flex; gap: 1px; align-items: center; }
        .heart-icon {
          color: #ef4444 !important;
          -webkit-text-fill-color: #ef4444 !important;
          filter: none !important;
          font-size: 12px;
          line-height: 1;
          display: inline-block;
          text-shadow: 0 0 0 #ef4444;
        }
        .heart-icon.heart-dead {
          color: #d1d5db !important;
          -webkit-text-fill-color: #d1d5db !important;
          opacity: 0.35;
        }
        [data-theme="dark"] .heart-icon {
          color: #ef4444 !important;
          -webkit-text-fill-color: #ef4444 !important;
        }
        [data-theme="dark"] .heart-icon.heart-dead {
          color: #4b5563 !important;
          -webkit-text-fill-color: #4b5563 !important;
        }
        /* BADGE LARANJA VISÍVEL - V9 */
        .concept-badge {
          background: #f59e0b !important;
          color: #000 !important;
          border: 1px solid #d97706 !important;
          font-weight: 700 !important;
          padding: 4px 10px !important;
          border-radius: 999px !important;
          font-size: 11px !important;
          text-transform: lowercase;
          letter-spacing: 0.02em;
          line-height: 1;
          display: inline-flex;
          align-items: center;
        }
        [data-theme="dark"] .concept-badge {
          background: #f59e0b !important;
          color: #000 !important;
          border-color: #f59e0b !important;
          box-shadow: 0 0 0 1px rgba(245,158,11,0.3);
        }
        @media (max-width: 400px) {
          .brand-title { font-size: 12px !important; line-height: 1.1; }
          .theme-btn { padding: 6px 10px !important; font-size: 11px !important; height: 26px; }
          .level-pill { padding: 6px 10px !important; font-size: 11px !important; height: 30px !important; }
          .top-stats { font-size: 10px !important; }
          .top-stats .progress-text { font-size: 10px !important; }
        }
        @media (max-width: 360px) {
          .brand-title { font-size: 11px !important; }

        }
